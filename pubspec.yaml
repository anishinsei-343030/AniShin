name: anime_app
description: "Anime streaming app built with Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Routing
  go_router: ^17.0.0

  # Networking
  dio: ^5.8.0

  # Video player
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

  # Local storage
  shared_preferences: ^2.5.0

  # HTML parsing (fallback scraping)
  html: ^0.15.6

  # Image caching
  cached_network_image: ^3.4.0

  # Utilities
  path_provider: ^2.1.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.3.0
  intl: ^0.20.0
  google_fonts: ^6.2.0
  flex_color_scheme: ^8.3.0
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
